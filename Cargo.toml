[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
common-error = { path = "crates/common-error", version = "0.1.0" }
common-config = { path = "crates/common-config", version = "0.1.0" }
common-telemetry = { path = "crates/common-telemetry", version = "0.1.0" }
common-types = { path = "crates/common-types", version = "0.1.0" }
common-lifecycle = { path = "crates/common-lifecycle", version = "0.1.0" }
common-axum = { path = "crates/common-axum", version = "0.1.0" }
common-resilience = { path = "crates/common-resilience", version = "0.1.0" }
common-db = { path = "crates/common-db", version = "0.1.0" }
common-http-client = { path = "crates/common-http-client", version = "0.1.0" }
common-test = { path = "crates/common-test", version = "0.1.0" }

axum = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
bytes = "1"
config = { version = "0.15", default-features = false, features = ["toml"] }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
sqlx = { version = "0.9", default-features = false }
tempfile = "3"
testcontainers-modules = { version = "0.15", default-features = false }
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
