[package]
name = "common-db"
description = "Postgres (sqlx) pool setup, health check, migrations and transactions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

[dependencies]
common-error = { workspace = true, features = ["sqlx"] }
common-types = { workspace = true, features = ["sqlx"] }
futures-util.workspace = true
serde.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "chrono", "uuid"] }
tracing.workspace = true

[dev-dependencies]
common-test = { workspace = true, features = ["postgres"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
