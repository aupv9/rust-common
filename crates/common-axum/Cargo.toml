[package]
name = "common-axum"
description = "axum integration: problem+json errors, extractors, middleware stack, health routes, server bootstrap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

[features]
default = []
otel = [
    "dep:common-telemetry",
    "common-telemetry/otel",
    "dep:opentelemetry",
    "dep:pin-project-lite",
]
auth = ["dep:common-auth", "dep:futures-util"]

[dependencies]
axum = { workspace = true, features = ["tokio", "http1", "http2", "json", "query", "matched-path"] }
common-auth = { workspace = true, optional = true }
common-error.workspace = true
common-lifecycle.workspace = true
common-telemetry = { workspace = true, optional = true }
common-types.workspace = true
futures-util = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["request-id", "trace", "catch-panic", "compression-gzip", "cors"] }
tracing.workspace = true

[dev-dependencies]
common-auth = { workspace = true, features = ["issuer"] }
http-body-util.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
