[package]
name = "common-axum"
description = "axum integration: problem+json errors, extractors, middleware stack, health routes, server bootstrap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
otel = ["dep:common-telemetry", "common-telemetry/otel"]

[dependencies]
axum = { workspace = true, features = ["tokio", "http1", "http2", "json", "query", "matched-path"] }
common-error.workspace = true
common-lifecycle.workspace = true
common-telemetry = { workspace = true, optional = true }
common-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["request-id", "trace", "catch-panic", "compression-gzip", "cors"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
