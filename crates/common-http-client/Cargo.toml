[package]
name = "common-http-client"
description = "reqwest client with timeouts, retries, circuit breaker, tracing and problem+json error mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
otel = ["dep:common-telemetry", "common-telemetry/otel"]

[dependencies]
common-error = { workspace = true, features = ["reqwest"] }
common-resilience.workspace = true
common-telemetry = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "http2", "charset"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1", "json"] }
common-resilience.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
